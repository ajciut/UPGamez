<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin UPGamez</title><link rel="stylesheet" href="/style.css"></head><body class="admin-body">
<header class="topbar"><a class="brand" href="/"><span class="brand-icon">U</span> UP<span>Gamez</span></a><a href="/" class="admin-link">← Lihat toko</a></header>
<main class="admin-wrap"><section id="login-panel" class="panel login-panel"><span class="eyebrow">UPGAMEZ CONTROL CENTER</span><h1>Admin <em>Login</em></h1><p>Masukkan password admin yang disetel di Cloudflare Worker.</p><form id="login-form"><label>Password admin<input id="admin-password" type="password" required></label><button class="primary-btn full">Masuk Dashboard</button></form><p id="login-error" class="error"></p></section>
<section id="dashboard" hidden><div class="admin-heading"><div><span class="eyebrow">CONTROL CENTER</span><h1>Dashboard <em>Admin</em></h1></div><button id="logout" class="secondary-btn">Keluar</button></div>
<div id="stats" class="stats"></div><div class="admin-columns"><section class="panel"><h2>Tambah / Edit Produk</h2><form id="product-form"><input id="p-id" type="hidden"><label>Nama produk<input id="p-name" required></label><label>Game / kategori<input id="p-game" required></label><label>Harga jual (angka)<input id="p-price" type="number" min="1" required></label><label>Deskripsi<input id="p-desc"></label><button class="primary-btn full">Simpan Produk</button><button type="button" id="clear-product" class="secondary-btn full">Form Baru</button></form></section><section class="panel"><h2>Daftar Produk</h2><div id="admin-products"></div></section></div>
<section class="panel"><h2>Pesanan Masuk</h2><div id="admin-orders"></div></section>
<section class="panel"><h2>Pengaturan Pembayaran</h2><form id="payment-form"><label>Nama bank / metode<input id="pay-method" placeholder="Contoh: BCA / QRIS"></label><label>Nomor rekening / instruksi<input id="pay-number" placeholder="Nomor rekening atau instruksi pembayaran"></label><label>Atas nama<input id="pay-name" placeholder="Nama pemilik rekening"></label><button class="primary-btn">Simpan Pengaturan</button></form></section></section></main><script src="/admin.js"></script></body></html>
